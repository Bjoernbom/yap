name: yap

options:
  bundleIdPrefix: com.bjornbom
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  indentWidth: 1
  tabWidth: 4
  usesTabs: true

packages:
  YapKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Release:
      # Strip on a plain `build`, not only on archive/install: the symbol
      # table is half the binary (16.6 MB -> 8.7 MB). Symbols stay in the dSYM.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  yap:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: YapKit
    entitlements:
      path: App/yap.entitlements
      properties:
        # Hardened runtime blocks the mic unless this is declared.
        com.apple.security.device.audio-input: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: yap
        CFBundleDisplayName: yap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Menu bar app: no Dock icon, no app menu.
        LSUIElement: true
        NSHumanReadableCopyright: yap is made by bjornbom. Open source, MIT.
        NSMicrophoneUsageDescription: yap listens only while you hold the key or take notes. Your voice never leaves this Mac.
        NSAudioCaptureUsageDescription: yap hears call audio only while you take notes, so the other side ends up in the transcript. It never leaves this Mac.
        # Accessibility (text insertion, global hotkey) has no Info.plist key.
        # macOS asks through AXIsProcessTrustedWithOptions and System Settings.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bjornbom.yap
        PRODUCT_NAME: yap
        # Generated by design/icon/generate.py; don't edit the PNGs by hand.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          # The stable self-signed identity (docs/SIGNING.md) from the
          # YAP_SIGN_IDENTITY environment variable or App/Signing.local.xcconfig;
          # ad-hoc otherwise, with a warning from the script below.
          CODE_SIGN_IDENTITY: $(YAP_SIGN_IDENTITY:default=-)
          # Not timestamped: Apple's timestamp service only serves Apple-issued certificates.
          OTHER_CODE_SIGN_FLAGS: --timestamp=none
    configFiles:
      Release: App/Release.xcconfig
    preBuildScripts:
      - name: Warn when Release is ad-hoc signed
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
        script: |
          if [ "$CONFIGURATION" = Release ] && [ "$CODE_SIGN_IDENTITY" = "-" ]; then
            echo "warning: Release build is AD-HOC signed. Its identity changes every build, so macOS drops Microphone and Accessibility permissions on update. Set YAP_SIGN_IDENTITY (docs/SIGNING.md)."
          fi
